name: is_web_request_driver
description: >-
  intersyntactic's web request driver: sends requests out of the home under the
  person's sign-ins, holding each sign-in's secret so no tool or record
  ever sees it.
version: 0.7.0
repository: https://github.com/intersyntactic/web_request_driver

environment:
  sdk: ^3.13.0

dependencies:
  is_effects: ^0.12.0
  is_peer_user_admission:
    git:
      url: https://github.com/intersyntactic/peer_user_admission
      ref: b5a2fa32ca1a278b121282f9e96370142e26196b

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
